services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: shopfilter
      POSTGRES_USER: shopfilter
      POSTGRES_PASSWORD: shopfilter
    ports:
      - "5432:5432"
    volumes:
      - shopfilter_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopfilter -d shopfilter"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: shopfilter
      MINIO_ROOT_PASSWORD: shopfilter-dev-only
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - shopfilter_minio:/data


  redis:
    image: redis@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - shopfilter_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.api
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://shopfilter:shopfilter@postgres:5432/shopfilter
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: shopfilter
      MINIO_SECRET_KEY: shopfilter-dev-only
      MINIO_SECURE: "false"
      MINIO_BUCKET: shopfilter-artifacts
      PUBLIC_WEB_URL: http://localhost:3000
      INVITATION_EXPIRY_HOURS: "168"
      INVITATION_EMAIL_DIRECTORY: /app/artifacts/mailbox
      EMAIL_VERIFICATION_EXPIRY_MINUTES: "60"
      EMAIL_VERIFICATION_EMAIL_DIRECTORY: /app/artifacts/mailbox
      PASSWORD_RESET_EXPIRY_MINUTES: "30"
      PASSWORD_RESET_EMAIL_DIRECTORY: /app/artifacts/mailbox
    ports:
      - "8000:8000"
    volumes:
      - ../../artifacts/mailbox:/app/artifacts/mailbox
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      redis:
        condition: service_healthy


  worker:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.worker
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://shopfilter:shopfilter@postgres:5432/shopfilter
      REDIS_URL: redis://redis:6379/0
      WORKER_HEARTBEAT_SECONDS: "10"
      WORKER_STALE_AFTER_SECONDS: "30"
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: shopfilter
      MINIO_SECRET_KEY: shopfilter-dev-only
      MINIO_SECURE: "false"
      MINIO_BUCKET: shopfilter-artifacts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started


  web:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.web
    environment:
      SHOPFILTER_API_INTERNAL_URL: http://api:8000
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://$${HOSTNAME}:3000/login"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  shopfilter_postgres:
  shopfilter_minio:
  shopfilter_redis:
