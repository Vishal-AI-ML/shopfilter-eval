[project]
name = "shopfilter-eval"
version = "0.1.0"
description = "Provider-agnostic evaluation and quality engineering for e-commerce search"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16.5",
    "argon2-cffi>=25.1.0",
    "fastapi>=0.117.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "psycopg[binary]>=3.2.10",
    "pyarrow>=18.0.0",
    "rich>=15.0.0",
    "sqlalchemy>=2.0.43",
    "typer>=0.27.2",
    "uvicorn[standard]>=0.36.0",
    "minio>=7.2.20",
]

[project.scripts]
shopfilter = "packages.cli.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
]
